version: 2

# Version updates cover both maintained branches. Cargo registry dependencies
# live in keygen-rs, which CMake builds separately from the root crate.
updates:
  - package-ecosystem: cargo
    directory: /keygen-rs
    schedule:
      interval: weekly
    # The protocol test API uses chia-bls public-key types.
    groups:
      chia:
        patterns:
          - chia-bls
          - chia-protocol

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      linters:
        patterns:
          - crate-ci/typos
          - DavidAnson/markdownlint-cli2-action
          - reviewdog/action-actionlint

  - package-ecosystem: cargo
    directory: /keygen-rs
    target-branch: cuda-only
    schedule:
      interval: weekly
    # The protocol test API uses chia-bls public-key types.
    groups:
      chia:
        patterns:
          - chia-bls
          - chia-protocol

  - package-ecosystem: github-actions
    directory: /
    target-branch: cuda-only
    schedule:
      interval: weekly
    groups:
      linters:
        patterns:
          - crate-ci/typos
          - DavidAnson/markdownlint-cli2-action
          - reviewdog/action-actionlint
