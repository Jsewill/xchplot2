name: arch-matrix

# Compile CUDA architectures not already built by install-matrix's containers.
# Those cover sm_61 (CUDA 12.9) and sm_75 (CUDA 13), plus CPU runtime checks.

on:
  pull_request:
    paths: &build-paths
      - .github/workflows/arch-matrix.yml
      - CMakeLists.txt
      - cmake/**
      - src/gpu/*.cu
      - src/gpu/AesGpu*.cuh
      - src/gpu/AesSBoxBP.cuh
      - src/gpu/AesTables.inl
      - src/gpu/PortableAttrs.hpp
      - src/gpu/SortCubInternal.cuh
      - contrib/pos2-plotter-output-move.patch
      - contrib/pos2-solver-*.patch
      - contrib/pos2-worker-thread-limit.patch
      - contrib/cccl-arch-list.patch
      - scripts/install-deps.sh
      - ci/release/adaptivecpp-level-zero-*.patch
  push:
    branches: [main]
    paths: *build-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arch / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sm_86 and sm_89
            architectures: '86;89'
            image: nvidia/cuda:13.0.1-devel-ubuntu24.04
          - name: sm_120
            architectures: '120'
            image: nvidia/cuda:12.9.1-devel-ubuntu24.04
    steps:
      - name: Bootstrap apt + sudo stub (container runs as root)
        run: |
          # The image supplies CUDA. Fetch the build tools from Ubuntu.
          rm -f /etc/apt/sources.list.d/cuda*.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git
          # install-deps.sh uses sudo; the container already runs as root.
          cat > /usr/local/bin/sudo <<'EOF'
          #!/bin/sh
          exec "$@"
          EOF
          chmod +x /usr/local/bin/sudo
      - uses: actions/checkout@v7
      - name: Cache /opt/adaptivecpp
        uses: actions/cache@v6
        with:
          path: /opt/adaptivecpp
          # The base image, installer and runtime patches determine the toolchain.
          key: acpp-${{ matrix.image }}-${{ hashFiles('scripts/install-deps.sh', 'ci/release/adaptivecpp-level-zero-*.patch') }}
      - name: Run scripts/install-deps.sh (LLVM/lld + AdaptiveCpp at /opt/adaptivecpp)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/install-deps.sh --gpu nvidia
      - name: Compile CUDA objects
        env:
          ARCHITECTURES: ${{ matrix.architectures }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DXCHPLOT2_BUILD_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="$ARCHITECTURES"
          cmake --build build --parallel 2 --target pos2_gpu_cuda_obj
