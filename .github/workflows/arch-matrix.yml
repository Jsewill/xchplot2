name: arch-matrix

# Compile CUDA objects for the documented GPU architectures without a GPU.
# install-matrix covers complete CLI builds and CPU runtime checks.

on:
  pull_request:
    paths:
      - .github/workflows/arch-matrix.yml
      - CMakeLists.txt
      - cmake/**
      - keygen-rs/**
      - src/**
      - tools/**
      - contrib/**
      - scripts/install-deps.sh
      - ci/release/adaptivecpp-*.patch
  push:
    branches: [main]
    paths:
      - .github/workflows/arch-matrix.yml
      - CMakeLists.txt
      - cmake/**
      - keygen-rs/**
      - src/**
      - tools/**
      - contrib/**
      - scripts/install-deps.sh
      - ci/release/adaptivecpp-*.patch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: arch / sm_${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 61
            # CUDA 12.9 is the last toolkit supporting Pascal.
            image: nvidia/cuda:12.9.1-devel-ubuntu24.04
          - arch: 75
            image: nvidia/cuda:13.0.1-devel-ubuntu24.04
          - arch: 86
            image: nvidia/cuda:13.0.1-devel-ubuntu24.04
          - arch: 89
            image: nvidia/cuda:13.0.1-devel-ubuntu24.04
          - arch: 120
            image: nvidia/cuda:12.9.1-devel-ubuntu24.04
    steps:
      - name: Bootstrap apt + sudo stub (container runs as root)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git
          # install-deps.sh uses sudo; the container already runs as root.
          cat > /usr/local/bin/sudo <<'EOF'
          #!/bin/sh
          exec "$@"
          EOF
          chmod +x /usr/local/bin/sudo
      - uses: actions/checkout@v7
      - name: Cache /opt/adaptivecpp
        id: cache-adaptivecpp
        uses: actions/cache@v6
        with:
          path: /opt/adaptivecpp
          # The base image, installer and runtime patches determine the toolchain.
          key: acpp-${{ matrix.image }}-${{ hashFiles('scripts/install-deps.sh', 'ci/release/adaptivecpp-level-zero-*.patch') }}
      - name: Run scripts/install-deps.sh (LLVM/lld + AdaptiveCpp at /opt/adaptivecpp)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ "${{ steps.cache-adaptivecpp.outputs.cache-hit }}" = "true" ]; then
            echo "[ci] AdaptiveCpp restored from cache; install-deps.sh"
            echo "[ci] will detect it at /opt/adaptivecpp and skip the build."
          fi
          bash scripts/install-deps.sh --gpu nvidia
      - name: cmake configure + build CUDA TUs (arch=${{ matrix.arch }})
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DXCHPLOT2_BUILD_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build --parallel 2 --target pos2_gpu_cuda_obj
