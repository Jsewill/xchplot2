name: Windows hardware qualification

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Windows check
        type: choice
        required: true
        default: host
        options: [host, pushed-cli, candidate-cli, candidate-gates, diagnose, verified-cli, archive-recovery, trace-worker, trace-refusal, trace-growth, file-sharing]

permissions:
  contents: read

jobs:
  host:
    name: Windows planner fixtures
    if: inputs.phase == 'host'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Chia-Network/pos2-chip
          ref: 077c692b51a32cde748e6a8f1ccefe5354c81fa8
          path: build/qualification-upstream
          persist-credentials: false
      - name: Configure Visual Studio
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $arm64 = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64'
          $component = if ($arm64) { 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          $visualStudio = & $vswhere -latest -products '*' -requires $component -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ build tools are required' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $target = if ($arm64) { 'arm64' } else { 'x64' }
          # LLVM 20 needs the VS 2022 STL supplied by this side-by-side toolset.
          $toolset = if ($arm64) { '-vcvars_ver=14.44' } else { '' }
          cmd /c "call `"$vcvars`" $target $toolset >nul && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process') }
          }
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:CUDA_PATH\bin;$env:HIP_PATH\bin;" + $env:PATH
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion', 'UniversalCRTSdkDir') {
              "$name=$([Environment]::GetEnvironmentVariable($name, 'Process'))" >> $env:GITHUB_ENV
          }
          clang-cl --version
      - name: Build and run resource and handoff fixtures with the Windows SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = (Get-Location).Path.Replace('\','/')
          $upstream = "$repo/build/qualification-upstream"
          $fixture = 'build/qualification-project'
          [void][IO.Directory]::CreateDirectory($fixture)
          @'
          cmake_minimum_required(VERSION 3.24)
          project(windows_planner LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          add_compile_definitions(NOMINMAX WIN32_LEAN_AND_MEAN _CRT_SECURE_NO_WARNINGS _USE_MATH_DEFINES)
          find_package(Git REQUIRED)
          find_package(Threads REQUIRED)
          add_subdirectory("@UPSTREAM@/lib/fse" fse)
          include("@REPO@/cmake/GroupPlotter.cmake")
          pos2_grow_prepare("@UPSTREAM@" grow_include)
          add_library(qualification_controller OBJECT "@REPO@/src/host/GroupPlotter.cpp")
          target_compile_definitions(qualification_controller PRIVATE XCHPLOT2_GROUP_COMMANDS=1 GROW_GPU_BACKEND=1 GROW_POOL_NETWORK=1)
          target_compile_options(qualification_controller PRIVATE -O0 -maes -msse4.1 -mssse3 -msse2)
          target_include_directories(qualification_controller BEFORE PRIVATE "${grow_include}" "@UPSTREAM@/src" "@UPSTREAM@/src/plot" "@REPO@/src" "@REPO@/keygen-rs/include")
          target_link_libraries(qualification_controller PRIVATE fse Threads::Threads)
          include("@REPO@/cmake/GroupTests.cmake")
          pos2_group_tests("@UPSTREAM@" "${grow_include}")
          foreach(target pos2_pr118_grow_replot_resources_test pos2_pr118_grow_farming_test pos2_pr118_grow_gpu_output_test)
            target_link_libraries(${target} PRIVATE advapi32 bcrypt psapi)
          endforeach()
          '@.Replace('@REPO@',$repo).Replace('@UPSTREAM@',$upstream) | Set-Content "$fixture/CMakeLists.txt"
          $build = 'build/qualification-planner'
          cmake -S $fixture -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          $tests = @('pos2_pr118_grow_replot_resources_test','pos2_pr118_grow_farming_test','pos2_pr118_grow_gpu_output_test')
          cmake --build $build --parallel 2 --target $tests
          foreach ($test in $tests) { & "$build/tools/parity/$test.exe" }
      - name: Compile the production group controller with the Windows SDK
        run: cmake --build build/qualification-planner --parallel 2 --target qualification_controller

  hardware:
    name: ${{ inputs.phase == 'candidate-gates' && 'Windows release host checks' || 'Windows AMD test archive' }}
    if: inputs.phase == 'pushed-cli' || inputs.phase == 'candidate-cli' || inputs.phase == 'candidate-gates' || inputs.phase == 'verified-cli'
    runs-on: windows-2022
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        arch: [x86_64]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.phase == 'pushed-cli' && '57ed5bca0d612a17f3ead53d011bd27fa6ebc084' || '69a33e4294c4847cb74b82487768de71f04affc4' }}
          persist-credentials: false
      - name: Install CUDA 12.9.1
        if: matrix.arch == 'x86_64'
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda.exe'
          Invoke-WebRequest 'https://developer.download.nvidia.com/compute/cuda/12.9.1/network_installers/cuda_12.9.1_windows_network.exe' -OutFile $installer
          $install = Start-Process $installer -ArgumentList '-s', '-n', 'nvcc_12.9', 'cudart_12.9', 'thrust_12.9' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "CUDA installer failed: $($install.ExitCode)" }
          "CUDA_PATH=$env:ProgramFiles\NVIDIA GPU Computing Toolkit\CUDA\v12.9" >> $env:GITHUB_ENV
      - name: Install CUDA 13.4.2 ARM64
        if: matrix.arch == 'aarch64'
        run: ./ci/release/install-cuda-arm64.ps1
      - name: Install HIP SDK 6.4.2 compiler components
        if: matrix.arch == 'x86_64'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = Join-Path $env:RUNNER_TEMP 'hip-sdk.exe'
          $unpacked = Join-Path $env:RUNNER_TEMP 'hip-sdk'
          Invoke-WebRequest 'https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-25.Q3-Win10-Win11-For-HIP.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'db474a0436edecbc2234a8d38402f1bae1cbf5a50c7e9b93eb6c0a7e0eb9c81a') {
              throw 'HIP SDK installer checksum mismatch'
          }
          # Install the build tools without installing a GPU driver on the runner.
          7z x -y "-o$unpacked" $installer 'Packages/Apps/ROCmSDKPackages/*' | Out-Null
          foreach ($component in 'SDKCore/ROCm_SDK_Core', 'RTCDevelopment/ROCm_RTC_Dev', 'RTCRuntime/ROCm_RTC_RT') {
              $msi = Join-Path $unpacked "Packages/Apps/ROCmSDKPackages/$component.msi"
              $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
              if ($install.ExitCode -notin 0, 3010) { throw "HIP SDK component failed: $component ($($install.ExitCode))" }
          }
          Remove-Item $installer, $unpacked -Recurse -Force
          "HIP_PATH=$env:ProgramFiles\AMD\ROCm\6.4" >> $env:GITHUB_ENV
      - name: Configure Visual Studio
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $arm64 = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64'
          $component = if ($arm64) { 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          $visualStudio = & $vswhere -latest -products '*' -requires $component -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ build tools are required' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $target = if ($arm64) { 'arm64' } else { 'x64' }
          # LLVM 20 needs the VS 2022 STL supplied by this side-by-side toolset.
          $toolset = if ($arm64) { '-vcvars_ver=14.44' } else { '' }
          cmd /c "call `"$vcvars`" $target $toolset >nul && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process') }
          }
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:CUDA_PATH\bin;$env:HIP_PATH\bin;" + $env:PATH
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion', 'UniversalCRTSdkDir') {
              "$name=$([Environment]::GetEnvironmentVariable($name, 'Process'))" >> $env:GITHUB_ENV
          }
          clang-cl --version
      - name: Install release Rust tooling
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          cargo install --locked --features cli cargo-about --version 0.9.2
      - uses: actions/cache/restore@v6
        id: cached_tls
        with:
          path: build/qa-tls/install
          key: qa-windows-x64-static-tls-v1-${{ hashFiles('ci/release/build-openssl-windows.ps1') }}
      - name: Build pinned release OpenSSL
        run: |
          if (Test-Path -PathType Leaf 'build/qa-tls/install/lib/libcrypto.lib') {
            [void][IO.Directory]::CreateDirectory("$PWD/build/release-windows/openssl")
            Copy-Item -LiteralPath 'build/qa-tls/install' -Destination "$PWD/build/release-windows/openssl/install" -Recurse
          } else {
            ./ci/release/build-openssl-windows.ps1 -BuildDir (Join-Path $PWD 'build/release-windows/openssl')
          }
      - name: Wait for the running main compiler
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_KEY: windows-acpp25.10-llvm20.1.8-all-ptx-v2-${{ hashFiles('ci/release/build-adaptivecpp-windows.ps1', 'ci/release/adaptivecpp-*.patch', 'contrib/adaptivecpp-*.patch') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $until = [DateTime]::UtcNow.AddMinutes(65)
          while ([DateTime]::UtcNow -lt $until) {
            $key = gh cache list --repo $env:GITHUB_REPOSITORY --ref refs/heads/main --key $env:TOOLCHAIN_KEY --limit 1 --json key --jq '.[0].key'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect the shared compiler cache' }
            if ($key -eq $env:TOOLCHAIN_KEY) { Write-Output 'The main compiler is ready'; return }
            $state = gh run view 45101142952 --repo $env:GITHUB_REPOSITORY --json status --jq .status
            if ($LASTEXITCODE -eq 0 -and $state -eq 'completed') { throw 'The main build finished without its compiler cache' }
            Start-Sleep -Seconds 40
          }
          throw 'The main compiler was not available before the wait deadline'
      - uses: actions/cache/restore@v6
        id: toolchain
        with:
          fail-on-cache-miss: true
          path: build/windows-toolchain/install
          key: ${{ matrix.arch == 'aarch64' && 'windows-arm64-acpp25.10-llvm20.1.8-msvc14.44-cuda-ze-ocl-ptx-v3' || 'windows-acpp25.10-llvm20.1.8-all-ptx-v2' }}-${{ hashFiles('ci/release/build-adaptivecpp-windows.ps1', 'ci/release/adaptivecpp-*.patch', 'contrib/adaptivecpp-*.patch') }}
      - name: Build the selected production target or run the native release host checks
        env:
          QA_PHASE: ${{ inputs.phase }}
          ACPP_PREFIX: ${{ github.workspace }}/build/windows-toolchain/install
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $script = [IO.File]::ReadAllText((Resolve-Path 'scripts/build-release.ps1'))
          $marker = '# Catch host regressions before compiling CUDA for every supported architecture.'
          $end = $script.IndexOf($marker,[StringComparison]::Ordinal)
          if ($end -lt 0) { throw 'Could not find the normal post-configuration build boundary' }
          $commands = @'
          cmake --build $BuildDir --parallel 2 --target xchplot2
          cpack --config (Join-Path $BuildDir 'CPackConfig.cmake') -B (Join-Path $BuildDir 'dist')
          '@
          if ($env:QA_PHASE -in 'candidate-gates','verified-cli') {
              $group = $script.Substring($end)
              $next = [regex]::Match($group, '(?m)^cmake --build \$BuildDir --parallel 2\r?$')
              if (!$next.Success) { throw 'Cannot locate the end of the regular host test suite' }
              $gates = $group.Substring(0,$next.Index)
              if (!$gates.Contains('^compute_(membership|worker)_network_test$')) { throw 'The native network suite was omitted' }
              $commands = if ($env:QA_PHASE -eq 'verified-cli') { $gates + [Environment]::NewLine + $commands } else { $gates }
          }
          $opensslLine = '& (Join-Path $PSScriptRoot ''../ci/release/build-openssl-windows.ps1'') -BuildDir (Join-Path $BuildDir ''openssl'')'
          $prefix = $script.Substring(0,$end)
          if (!$prefix.Contains($opensslLine)) { throw 'The normal OpenSSL build hook changed' }
          foreach ($file in 'include/openssl/ssl.h','lib/libssl.lib','lib/libcrypto.lib','openssl-license.txt') {
              if (!(Test-Path -PathType Leaf -LiteralPath "build/release-windows/openssl/install/$file")) { throw "Missing prebuilt TLS input $file" }
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'scripts/build-hardware-qualification.ps1'), $prefix.Replace($opensslLine,'') + $commands)
          & ./scripts/build-hardware-qualification.ps1
          git diff --exit-code HEAD --
          $source = (git rev-parse HEAD).Trim()
          if (!(Select-String -LiteralPath build/release-windows/BUILDINFO.txt -Pattern "^Source: $source$" -Quiet)) { throw 'Package source differs from the checkout' }
      - name: Exercise authenticated transport after a host fixture failure
        if: (inputs.phase == 'candidate-gates' || inputs.phase == 'verified-cli') && failure()
        run: |
          if (!(Test-Path 'build/release-windows/tools/parity/pos2_pr118_grow_worker_test.exe')) { throw 'Native host targets did not build' }
          ctest --test-dir build/release-windows --output-on-failure --no-tests=error --timeout 900 -R '^compute_(membership|worker)_network_test$'
      - uses: actions/upload-artifact@v7
        if: inputs.phase != 'candidate-gates'
        with:
          name: windows-hardware-x86_64
          path: |
            build/release-windows/dist/*.zip
            build/release-windows/dist/*.sha256
          retention-days: 5
          if-no-files-found: error
  topology:
    name: Hosted Windows processor groups
    if: inputs.phase == 'diagnose' || inputs.phase == 'candidate-gates'
    runs-on: windows-2022
    steps:
      - name: Read the inherited Windows group and affinity masks
        shell: python
        run: |
          import ctypes as c
          from ctypes import wintypes as w
          k = c.WinDLL('kernel32', use_last_error=True)
          k.GetCurrentProcess.restype = w.HANDLE
          p = k.GetCurrentProcess()
          k.GetActiveProcessorGroupCount.restype = w.WORD
          actual = k.GetActiveProcessorGroupCount()
          print('Active processor groups', actual)
          k.GetProcessGroupAffinity.argtypes = [w.HANDLE, c.POINTER(w.WORD), c.POINTER(w.WORD)]
          for size in (0, 1, actual, max(64, actual)):
              groups = (w.WORD * size)() if size else None
              count = w.WORD(size)
              c.set_last_error(0)
              ok = k.GetProcessGroupAffinity(p, c.byref(count), groups)
              error = c.get_last_error()
              print('Provided', size, 'success', ok, 'error', error, 'returned', count.value,
                    'groups', list(groups[:count.value]) if ok and groups is not None else [])
          k.GetProcessAffinityMask.argtypes = [w.HANDLE, c.POINTER(c.c_size_t), c.POINTER(c.c_size_t)]
          process, system = c.c_size_t(), c.c_size_t()
          ok = k.GetProcessAffinityMask(p, c.byref(process), c.byref(system))
          print('Affinity success', ok, 'process', hex(process.value), 'system', hex(system.value))
          for offset in (0, 2, 4, 6):
              backing = c.create_string_buffer(16)
              groups = c.cast(c.byref(backing, offset), c.POINTER(w.WORD))
              count = w.WORD(1)
              c.set_last_error(0)
              ok = k.GetProcessGroupAffinity(p, c.byref(count), groups)
              print('Group output mod8', c.addressof(groups.contents) % 8, 'success', ok, 'error', c.get_last_error(), 'memberships', count.value)
      - name: Read private resident memory for a held proof process
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import ctypes as c
          from ctypes import wintypes as w
          import json, platform, subprocess, sys
          k = c.WinDLL('kernel32', use_last_error=True)
          n = c.WinDLL('ntdll')
          size = c.c_size_t
          class Counters(c.Structure):
              _fields_ = [('cb',w.DWORD),('pageFaults',w.DWORD)] + [(key,size) for key in ('peakWS','workingSet','quotaPeakPaged','quotaPaged','quotaPeakNonPaged','quotaNonPaged','pagefile','peakPagefile','commit','privateWS')] + [('sharedCommit',c.c_uint64)]
          class Vm(c.Structure):
              _fields_ = [('peakVirtual',size),('virtual',size),('pageFaults',w.ULONG)] + [(key,size) for key in ('peakWS','workingSet','quotaPeakPaged','quotaPaged','quotaPeakNonPaged','quotaNonPaged','pagefile','peakPagefile','commit','privateWS','sharedCommit')]
          k.GetCurrentProcess.restype = w.HANDLE
          k.K32GetProcessMemoryInfo.argtypes = [w.HANDLE,c.c_void_p,w.DWORD]
          n.NtQueryInformationProcess.argtypes = [w.HANDLE,w.ULONG,c.c_void_p,w.ULONG,c.POINTER(w.ULONG)]
          n.NtQueryInformationProcess.restype = w.LONG
          def counters(handle):
              value = Counters(); value.cb = c.sizeof(value); value.privateWS = size(-1).value
              c.set_last_error(0); ok = k.K32GetProcessMemoryInfo(handle,c.byref(value),c.sizeof(value)); err = c.get_last_error()
              vm = Vm(); vm.privateWS = size(-1).value; amount = w.ULONG()
              status = n.NtQueryInformationProcess(handle,3,c.byref(vm),c.sizeof(vm),c.byref(amount))
              return {'psapi':{'ok':ok,'lastError':err,'requested':c.sizeof(value),'cb':value.cb,'privateResident':value.privateWS,'workingSet':value.workingSet,'privateCommit':value.commit}, 'native':{'status':hex(status & 0xffffffff),'requested':c.sizeof(vm),'returned':amount.value,'privateResident':vm.privateWS,'workingSet':vm.workingSet,'privateCommit':vm.commit}}
          with subprocess.Popen([sys.executable,'-c',"import sys,time; b=bytearray(8<<20); print('ready',flush=True); sys.stdin.readline()"],stdin=subprocess.PIPE,stdout=subprocess.PIPE) as proc:
              try:
                  print(json.dumps({'windows':platform.version(),'startup':counters(int(proc._handle)), 'owner':counters(k.GetCurrentProcess())}),flush=True)
                  assert proc.stdout.readline().strip() == b'ready'
                  print(json.dumps({'active':counters(int(proc._handle))}),flush=True)
              finally:
                  proc.stdin.write(b'\n'); proc.stdin.flush(); proc.wait(timeout=5)
          '@ | python -B -
          exit $LASTEXITCODE
  diagnostics:
    name: Native compute and construction fixtures
    if: inputs.phase == 'diagnose' || inputs.phase == 'trace-worker' || inputs.phase == 'trace-refusal' || inputs.phase == 'trace-growth'
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 69a33e4294c4847cb74b82487768de71f04affc4
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: Chia-Network/pos2-chip
          ref: 077c692b51a32cde748e6a8f1ccefe5354c81fa8
          path: build/qualification-upstream
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: mjansson/mdns
          ref: a569c4759bd47e0f2a7bfc4d4c19620445782806
          path: build/qualification-mdns
          persist-credentials: false
      - name: Configure Visual Studio
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $arm64 = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64'
          $component = if ($arm64) { 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          $visualStudio = & $vswhere -latest -products '*' -requires $component -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ build tools are required' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $target = if ($arm64) { 'arm64' } else { 'x64' }
          # LLVM 20 needs the VS 2022 STL supplied by this side-by-side toolset.
          $toolset = if ($arm64) { '-vcvars_ver=14.44' } else { '' }
          cmd /c "call `"$vcvars`" $target $toolset >nul && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process') }
          }
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:CUDA_PATH\bin;$env:HIP_PATH\bin;" + $env:PATH
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion', 'UniversalCRTSdkDir') {
              "$name=$([Environment]::GetEnvironmentVariable($name, 'Process'))" >> $env:GITHUB_ENV
          }
          clang-cl --version
      - uses: actions/cache/restore@v6
        id: tls
        with:
          path: build/qa-tls/install
          key: qa-windows-x64-static-tls-v1-${{ hashFiles('ci/release/build-openssl-windows.ps1') }}
      - name: Build the pinned TLS dependency
        if: steps.tls.outputs.cache-hit != 'true'
        run: ./ci/release/build-openssl-windows.ps1 -BuildDir (Join-Path $PWD 'build/qa-tls')
      - uses: actions/cache/save@v6
        if: steps.tls.outputs.cache-hit != 'true'
        with:
          path: build/qa-tls/install
          key: ${{ steps.tls.outputs.cache-primary-key }}
      - name: Configure the repository's native host and group fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          $repo = (Get-Location).Path.Replace('\','/')
          $normal = [IO.File]::ReadAllText((Resolve-Path 'CMakeLists.txt'))
          $start = $normal.IndexOf('set(POS2_KEYGEN_CRATE_DIR ',[StringComparison]::Ordinal)
          $stop = $normal.IndexOf('# xchplot2_cli: the CLI dispatch logic',$start,[StringComparison]::Ordinal)
          if ($start -lt 0 -or $stop -le $start) { throw 'Could not locate the normal Rust library target' }
