      - name: Observe temporary refusal and the broker's retry state
        if: inputs.phase == 'trace-refusal'
        shell: python
        run: |
          import subprocess
          patch = r'''
          --- a/tools/parity/compute_worker_client_test.cpp
          +++ b/tools/parity/compute_worker_client_test.cpp
          @@ -1211,13 +1211,29 @@
                           output = true;
                       };
                       refuse = true; bool rejected = false;
          -            try { request(); } catch (pool::TransientTransport const&) { rejected = true; }
          +            auto describe = [&] { return std::string(local ? "local " : "remote ") + (kind == 0 ? "packed" : kind == 1 ? "contributions" : "encode"); };
          +            auto const begin = Clock::now();
          +            try { request(); } catch (pool::TransientTransport const& err) {
          +                std::cerr << "refusal " << describe() << " selected=" << !refuse << " error=" << err.what() << '\n';
          +                rejected = true;
          +            }
                       require(rejected && !output && !service.status().accepted_tasks,
                           "paused worker did not refuse the granted task before execution");
                       service.control(WorkerControl::Resume); ++task.attempt; delayed_pause = true;
                       try { request(); }
                       catch (std::exception const& error)
          -            { throw std::runtime_error("retry after temporary worker refusal failed: " + std::string(error.what())); }
          +            {
          +                auto current = service.status(); auto api = worker_control.status({pool::StatusSection::Jobs});
          +                auto registry = worker_control.status({pool::StatusSection::Workers});
          +                std::cerr << "retry " << describe() << " selected=" << !delayed_pause << " duration ms="
          +                    << std::chrono::duration_cast<std::chrono::milliseconds>(Clock::now() - begin).count()
          +                    << " local admission=" << unsigned(current.admission)
          +                    << " broker admission=" << (registry.worker_records.empty() ? 0 : unsigned(registry.worker_records.front().admission))
          +                    << " jobs=" << api.jobs << '\n';
          +                for (auto const& job : api.job_records) std::cerr << "job " << job.id << " attempt=" << job.attempt << " state="
          +                    << unsigned(job.state) << " reason=" << pool::wait_reason_name(job.waiting) << '\n';
          +                throw std::runtime_error("retry after temporary worker refusal failed: " + std::string(error.what()));
          +            }
                       require(output, "temporary refusal excluded the only worker from the task's retry");
                   }
                   require(client.stats().failed_tasks == 3, "temporary refusals lost their failure accounting");
          '''
          subprocess.run(['git','apply','--whitespace=nowarn','-'], input=patch.lstrip().encode(), check=True)
      - name: Trace both address families during a live worker join
        if: inputs.phase == 'trace-growth'
        shell: python
        run: |
          from pathlib import Path

          def replace_one(text, before, after):
              assert text.count(before)==1, before
              return text.replace(before,after)
          path=Path("src/host/ComputeWorker.cpp")
          s=path.read_text()
          i=s.index("    void refresh_brokers()")
          j=s.index("    void rotate_brokers(",i)
