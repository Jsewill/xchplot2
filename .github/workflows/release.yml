name: Binary release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CMakeLists.txt
      - LICENSE
      - cmake/**
      - ci/release/**
      - keygen-rs/**
      - src/**
      - tools/**
      - contrib/pos2-*.patch
      - contrib/cccl-*.patch
      - scripts/build-release.sh
      - scripts/build-release.ps1
      - scripts/test/release.py
      - scripts/test/windows.py
  push:
    tags: ['v*-cuda-only']
  workflow_dispatch:
    inputs:
      platform:
        description: Release builds to check
        type: choice
        default: all
        options: [all, linux, windows]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select release checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      full_build: ${{ steps.filter.outputs.full_build }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            full_build:
              - '**'
              - '!keygen-rs/{Cargo.toml,Cargo.lock}'
              - '!ci/release/rust-toolchain'
            shared:
              - '.github/workflows/release.yml'
              - '{CMakeLists.txt,LICENSE}'
              - 'cmake/**'
              - 'ci/release/{licenses.hbs,rust-toolchain}'
              - 'keygen-rs/**'
              - 'src/**'
              - 'tools/**'
              - '!tools/xchplot2/*.{rc,manifest}'
              - 'contrib/pos2-*.patch'
              - 'contrib/cccl-arch-list.patch'
              - 'scripts/test/release.py'
            linux:
              - 'ci/release/{Containerfile,README.txt}'
              - 'scripts/build-release.sh'
            windows:
              - 'ci/release/*.ps1'
              - 'ci/release/{README.windows.txt,microsoft-runtime.txt}'
              - 'scripts/build-release.ps1'
              - 'scripts/test/windows.py'
              - 'tools/xchplot2/*.{rc,manifest}'
              - 'contrib/cccl-windows-ptx.patch'

  linux-cuda:
    needs: changes
    if: >-
      inputs.platform != 'windows' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.linux == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build release image
        run: docker build -t xchplot2-release -f ci/release/Containerfile ci/release
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          docker run --rm -e RELEASE_TAG -v "$PWD:/src" xchplot2-release \
            bash scripts/build-release.sh
      - name: Check extracted archive on the oldest supported runtime
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ubuntu:22.04 bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends python3 libstdc++6
            python3 scripts/test/release.py build/release/dist/*.tar.gz
          '
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-cuda
          path: |
            build/release/dist/*.tar.gz
            build/release/dist/*.sha256
          if-no-files-found: error

  windows-cuda:
    needs: changes
    if: >-
      inputs.platform != 'linux' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.windows == 'true')
    env:
      CARGO_ABOUT_VERSION: '0.9.2'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Install CUDA 12.9.1 compiler and runtime headers
        if: matrix.arch == 'x86_64'
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda.exe'
          Invoke-WebRequest 'https://developer.download.nvidia.com/compute/cuda/12.9.1/network_installers/cuda_12.9.1_windows_network.exe' -OutFile $installer
          $install = Start-Process $installer -ArgumentList '-s', '-n', 'nvcc_12.9', 'cudart_12.9', 'thrust_12.9' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "CUDA installer failed: $($install.ExitCode)" }
          "CUDA_PATH=$env:ProgramFiles\NVIDIA GPU Computing Toolkit\CUDA\v12.9" >> $env:GITHUB_ENV
      - name: Install CUDA 13.4.2 ARM64 compiler and runtime headers
        if: matrix.arch == 'aarch64'
        run: ./ci/release/install-cuda-arm64.ps1
      - name: Install release Rust tooling
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rustVersion = (Get-Content -Raw ci/release/rust-toolchain).Trim()
          rustup toolchain install $rustVersion --profile minimal
          rustup default $rustVersion
      - uses: actions/cache@v6
        id: cargo-about
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: windows-${{ matrix.arch }}-cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ hashFiles('ci/release/rust-toolchain') }}
      - name: Install release notice generator
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install --locked --features cli cargo-about --version $env:CARGO_ABOUT_VERSION
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          PACKAGE_TARGETS_ONLY: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full_build == 'false' }}
        run: |
          $env:CMAKE_BUILD_PARALLEL_LEVEL = [Math]::Min(4, [Environment]::ProcessorCount)
          ./scripts/build-release.ps1 -PackageTargetsOnly:($env:PACKAGE_TARGETS_ONLY -eq 'true')
      - name: Check extracted archive without toolkit libraries on PATH
        run: |
          $python = (Get-Command python.exe).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $archive = (Get-ChildItem build/release-windows/dist/*.zip).FullName
          & $python scripts/test/release.py $archive
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-cuda
          path: |
            build/release-windows/dist/*.zip
            build/release-windows/dist/*.sha256
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-cuda, windows-cuda]
    runs-on: ubuntu-24.04
    concurrency:
      group: binary-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-cuda'
          merge-multiple: true
          path: dist
      - name: Attach archives to the shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG%-cuda-only}"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/*
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
