name: Binary release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CMakeLists.txt
      - LICENSE
      - NOTICE
      - cmake/**
      - ci/release/**
      - keygen-rs/**
      - src/host/**
      - src/gpu/**
      - tools/**
      - contrib/pos2-*.patch
      - contrib/cccl-*.patch
      - contrib/adaptivecpp-windows-*.patch
      - scripts/build-release.sh
      - scripts/build-release.ps1
      - scripts/test/recovery.py
      - scripts/test/release.py
      - scripts/test/group-cli.py
      - scripts/test/compute-cli.py
      - scripts/test/group-pool-test.py
  push:
    tags: ['v*', '!v*-cuda-only']
  workflow_dispatch:
    inputs:
      platform:
        description: Release builds to check
        type: choice
        default: all
        options: [all, linux, windows]
      architecture:
        description: Host CPU architecture
        type: choice
        default: all
        options: [all, x86_64, aarch64]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.platform || 'all' }}-${{ inputs.architecture || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select release checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            shared:
              - '.github/workflows/release.yml'
              - '{CMakeLists.txt,LICENSE,NOTICE}'
              - 'cmake/**'
              - 'keygen-rs/{Cargo.toml,Cargo.lock,about.toml,src/**,include/**}'
              - 'src/{host,gpu}/**'
              - 'tools/**'
              - '!tools/xchplot2/*.{rc,manifest}'
              - '!tools/xchplot2/compute_service_windows.cpp'
              - '!tools/xchplot2/compute_service.cpp'
              - 'contrib/pos2-*.patch'
              - 'contrib/cccl-arch-list.patch'
              - 'ci/release/adaptivecpp-*.patch'
              - 'ci/release/{adaptivecpp-third-party.txt,llvm-third-party.txt,licenses.hbs,check-cuda-ptx.py,rust-toolchain}'
              - 'scripts/test/{recovery,release,group-cli,compute-cli,group-pool-test}.py'
            linux:
              - 'ci/release/{Containerfile,README.txt}'
              - 'scripts/build-release.sh'
              - 'tools/xchplot2/compute_service.cpp'
            windows:
              - 'ci/release/*.ps1'
              - 'ci/release/{README.windows.txt,amd-runtime.txt,microsoft-runtime.txt}'
              - 'scripts/build-release.ps1'
              - 'tools/xchplot2/*.{rc,manifest}'
              - 'tools/xchplot2/compute_service_windows.cpp'
              - 'contrib/adaptivecpp-windows-*.patch'
              - 'contrib/cccl-windows-ptx.patch'

  linux-sycl:
    needs: changes
    if: >-
      inputs.platform != 'windows' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.linux == 'true')
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture && inputs.architecture != 'all' && format('["{0}"]', inputs.architecture) || '["x86_64", "aarch64"]') }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build release image
        run: |
          docker build --build-arg BASE_IMAGE=${{ matrix.arch == 'aarch64' && 'ubuntu:26.04' || 'nvidia/cuda:12.9.1-devel-ubuntu24.04' }} \
            -t xchplot2-release -f ci/release/Containerfile ci/release
      - name: Build and package
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          docker run --rm -e RELEASE_TAG -v "$PWD:/src" xchplot2-release \
            bash scripts/build-release.sh
      - name: Check the extracted runtime and CPU proofs
        run: |
          docker run --rm -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/src:ro" -w /src ${{ matrix.arch == 'aarch64' && 'ubuntu:26.04' || 'ubuntu:24.04' }} bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends \
              python3 libstdc++6 libnuma1 libelf1t64 libdrm2 libdrm-amdgpu1
            python3 scripts/test/release.py build/release-linux/dist/*.tar.gz \
              --sycl-probe build/release-linux/tools/sanity/hellosycl
          '
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: linux-${{ matrix.arch }}-sycl
          path: |
            build/release-linux/dist/*.tar.gz
            build/release-linux/dist/*.sha256
          if-no-files-found: error

  windows-sycl:
    needs: changes
    if: >-
      inputs.platform != 'linux' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.shared == 'true' ||
       needs.changes.outputs.windows == 'true')
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture && inputs.architecture != 'all' && format('["{0}"]', inputs.architecture) || '["x86_64", "aarch64"]') }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Install CUDA 12.9.1
        if: matrix.arch == 'x86_64'
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda.exe'
          Invoke-WebRequest 'https://developer.download.nvidia.com/compute/cuda/12.9.1/network_installers/cuda_12.9.1_windows_network.exe' -OutFile $installer
          $install = Start-Process $installer -ArgumentList '-s', '-n', 'nvcc_12.9', 'cudart_12.9', 'thrust_12.9' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "CUDA installer failed: $($install.ExitCode)" }
          "CUDA_PATH=$env:ProgramFiles\NVIDIA GPU Computing Toolkit\CUDA\v12.9" >> $env:GITHUB_ENV
      - name: Install CUDA 13.4.2 ARM64
        if: matrix.arch == 'aarch64'
        run: ./ci/release/install-cuda-arm64.ps1
      - name: Install HIP SDK 6.4.2 compiler components
        if: matrix.arch == 'x86_64'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = Join-Path $env:RUNNER_TEMP 'hip-sdk.exe'
          $unpacked = Join-Path $env:RUNNER_TEMP 'hip-sdk'
          Invoke-WebRequest 'https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-25.Q3-Win10-Win11-For-HIP.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'db474a0436edecbc2234a8d38402f1bae1cbf5a50c7e9b93eb6c0a7e0eb9c81a') {
              throw 'HIP SDK installer checksum mismatch'
          }
          # Install the build tools without installing a GPU driver on the runner.
          7z x -y "-o$unpacked" $installer 'Packages/Apps/ROCmSDKPackages/*' | Out-Null
          foreach ($component in 'SDKCore/ROCm_SDK_Core', 'RTCDevelopment/ROCm_RTC_Dev', 'RTCRuntime/ROCm_RTC_RT') {
              $msi = Join-Path $unpacked "Packages/Apps/ROCmSDKPackages/$component.msi"
              $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
              if ($install.ExitCode -notin 0, 3010) { throw "HIP SDK component failed: $component ($($install.ExitCode))" }
          }
          Remove-Item $installer, $unpacked -Recurse -Force
          "HIP_PATH=$env:ProgramFiles\AMD\ROCm\6.4" >> $env:GITHUB_ENV
      - name: Configure Visual Studio
        id: vs
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $arm64 = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64'
          $component = if ($arm64) { 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          $visualStudio = & $vswhere -latest -products '*' -requires $component -property installationPath
          if (-not $visualStudio) { throw 'Visual Studio C++ build tools are required' }
          $vcvars = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvarsall.bat'
          $target = if ($arm64) { 'arm64' } else { 'x64' }
          # LLVM 20 needs the VS 2022 STL supplied by this side-by-side toolset.
          $toolset = if ($arm64) { '-vcvars_ver=14.44' } else { '' }
          cmd /c "call `"$vcvars`" $target $toolset >nul && set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process') }
          }
          $env:PATH = "$env:ProgramFiles\LLVM\bin;$env:CUDA_PATH\bin;$env:HIP_PATH\bin;" + $env:PATH
          foreach ($name in 'PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion', 'UniversalCRTSdkDir') {
              "$name=$([Environment]::GetEnvironmentVariable($name, 'Process'))" >> $env:GITHUB_ENV
          }
          clang-cl --version
          $toolchainFiles = @((Get-Command clang-cl.exe).Source, (Get-Command nvcc.exe).Source)
          if ($arm64) {
              $toolchainFiles += 'ci/release/install-cuda-arm64.ps1'
          } else {
              $toolchainFiles += "$env:HIP_PATH/bin/hiprtc0604.dll"
          }
          $sdk = $env:WindowsSDKVersion.TrimEnd('\')
          "toolchain=$env:VCToolsVersion-$sdk-$((Get-FileHash -LiteralPath $toolchainFiles).Hash -join '-')" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: toolchain
        with:
          path: build/windows-toolchain/install
          key: >-
            windows-${{ matrix.arch }}-acpp-${{ steps.vs.outputs.toolchain }}-${{
            hashFiles('ci/release/build-adaptivecpp-windows.ps1', 'ci/release/adaptivecpp-*.patch',
                      'contrib/adaptivecpp-windows-*.patch', 'ci/release/check-cuda-ptx.py', 'tools/xchplot2/windows.manifest') }}
      - name: Build AdaptiveCpp with LLVM
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: ./ci/release/build-adaptivecpp-windows.ps1
      - name: Check Windows AMDGPU bitcode ABI
        if: matrix.arch == 'x86_64'
        run: |
          $ir = & build/windows-toolchain/install/bin/llvm-dis.exe `
              build/windows-toolchain/install/lib/hipSYCL/bitcode/libkernel-sscp-amdgpu-amdhsa-full.bc -o -
          if ($LASTEXITCODE -ne 0 -or -not ($ir -match '!"wchar_size", i32 2')) {
              throw 'AMDGPU bitcode must use the Windows HIP wchar size'
          }
      - uses: actions/cache/save@v6
        if: steps.toolchain.outputs.cache-hit != 'true'
        with:
          path: build/windows-toolchain/install
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Install release Rust tooling
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rustVersion = (Get-Content -Raw ci/release/rust-toolchain).Trim()
          rustup toolchain install $rustVersion --profile minimal
          rustup default $rustVersion
          cargo install --locked --features cli cargo-about --version 0.9.2
      - name: Build and package
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          ACPP_PREFIX: ${{ github.workspace }}/build/windows-toolchain/install
        run: ./scripts/build-release.ps1
      - name: Check the extracted runtime and Windows CPU proofs
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $python = (Get-Command python.exe).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($name in 'LIB', 'LIBPATH', 'INCLUDE', 'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UCRTVersion', 'UniversalCRTSdkDir') {
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }
          $archive = (Get-ChildItem build/release-windows/dist/*.zip).FullName
          # Hide the absolute fallback paths compiled into AdaptiveCpp, too.
          Rename-Item build/windows-toolchain/install install-hidden
          $hip = $env:HIP_PATH
          $cuda = $env:CUDA_PATH
          if ($hip) { Rename-Item $hip ((Split-Path $hip -Leaf) + '-hidden') }
          Rename-Item $cuda ((Split-Path $cuda -Leaf) + '-hidden')
          foreach ($name in 'HIP_PATH', 'ROCM_PATH', 'CUDA_PATH', 'CUDA_PATH_V12_9', 'ACPP_PREFIX') {
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }
          try {
              & $python scripts/test/release.py $archive `
                  --sycl-probe build/release-windows/tools/sanity/hellosycl.exe
          } finally {
              if ($hip) { Rename-Item "$hip-hidden" (Split-Path $hip -Leaf) }
              Rename-Item "$cuda-hidden" (Split-Path $cuda -Leaf)
              Rename-Item build/windows-toolchain/install-hidden install
          }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: windows-${{ matrix.arch }}-sycl
          path: |
            build/release-windows/dist/*.zip
            build/release-windows/dist/*.sha256
          if-no-files-found: error

  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux-sycl, windows-sycl]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: binary-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-sycl*'
          merge-multiple: true
          path: dist
      - name: Attach archives to the shared draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG%-cuda-only}"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/*
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
