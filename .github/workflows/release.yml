                              (unsigned long long)broker->revision, brokers.size(), error.what());''')
          path.write_text("#include <cstdio>\n"+s[:i]+code+s[j:])
          path=Path("tools/parity/compute_worker_client_test.cpp")
          s=path.read_text()
          before="    session.offer_local(offer(args));\n    auto baseline = cold.get();"
          after=r'''    session.offer_local(offer(args));
              auto track = [&](char const* name, std::shared_ptr<WorkerService> worker)
              {
                  return std::jthread([&, name, worker](std::stop_token stop)
                  {
                      unsigned beat = 0;
                      while (!stop.stop_requested())
                      {
                          if (!(beat++ % 4)) try
                          {
                              auto worker_status = worker->status(); auto state = control.status();
                              std::fprintf(stderr, "growth %s known=%llu healthy=%llu deferred=%llu limit=%llu owners_workers=%llu queued=%llu granted=%llu running=%llu\n",
                                  name,(unsigned long long)worker_status.known_brokers,(unsigned long long)worker_status.healthy_brokers,
                                  (unsigned long long)worker_status.deferred_brokers,(unsigned long long)worker_status.broker_limit,
                                  (unsigned long long)state.workers,(unsigned long long)state.queued,(unsigned long long)state.granted,(unsigned long long)state.running);
                          }
                          catch (std::exception const& err) { std::fprintf(stderr, "growth sampling failed %s\n",err.what()); }
                          std::this_thread::sleep_for(std::chrono::milliseconds(200));
                      }
                  });
              };
              auto first_monitor = track("original",session.local_worker());
              std::cerr << "growth wait initial generation" << std::endl;
              auto baseline = cold.get();'''
          s=replace_one(s,before,after)
          s=replace_one(s,"        helper.offer_local(offer(helper_args));\n        remote = generate(false, 2);",'''        helper.offer_local(offer(helper_args));
                  auto helper_monitor = track("helper",helper.local_worker());
                  std::cerr << "growth submit helper members" << std::endl;
                  remote = generate(false, 2);
                  std::cerr << "growth helper delivered" << std::endl;''')
          s=replace_one(s,"    release.set_value(); auto local = original.get();","    std::cerr << \"growth release original\" << std::endl;\n    release.set_value(); auto local = original.get();")
          s=replace_one(s,"    require(deliveries.size() == receipts_before_release + 2 &&",r"""    std::cerr << "growth evidence";
              for (auto const& item : deliveries) std::cerr << " [helper=" << (item.worker_identity == helper_identity) << " local=" << item.local_direct << " members=" << item.work_units << "]";
              std::cerr << " rosters=";
              for (auto count : rosters) std::cerr << count << ",";
              std::cerr << std::endl;
              require(deliveries.size() == receipts_before_release + 2 &&""")
          path.write_text("#include <cstdio>\n"+s)
      - name: Identify the native worker phase which reaches its deadline
        if: inputs.phase == 'trace-worker' || inputs.phase == 'trace-refusal' || inputs.phase == 'trace-growth'
        shell: python
        env:
          QA_TRACE: ${{ inputs.phase }}
        run: |
          import os
          from pathlib import Path
          import re
          path = Path('tools/parity/compute_worker_client_test.cpp')
          text = path.read_text(encoding='utf-8')
          line, = [s for s in text.splitlines() if 'retry_pressure(); planning_feedback();' in s]
          cases = re.findall(r'(\w+)\(\);', line)
          assert len(cases) > 10 and text.count(line) == 1
          if os.environ['QA_TRACE'] == 'trace-refusal':
              cases = ['temporary_worker_refusal']
          elif os.environ['QA_TRACE'] == 'trace-growth':
              cases = ['automatic_pool_growth']
          body = ['    auto trace = [](const char* name, auto phase) {',
                  '        auto const start = std::chrono::steady_clock::now();',
                  '        std::cerr << "start " << name << std::endl;',
                  '        try { phase(); } catch (std::exception const& ex) { std::cerr << "case failed " << name << ": " << ex.what() << std::endl; throw; }',
                  '        std::cerr << "passed " << name << " ms=" << std::chrono::duration_cast<std::chrono::milliseconds>(std::chrono::steady_clock::now()-start).count() << std::endl;',
                  '    };']
          body += ['    trace("' + name + '", ' + name + ');' for name in cases]
          path.write_text(text.replace(line, '\n'.join(body)), encoding='utf-8')
      - name: Repeat the traced native worker lifecycle
        if: inputs.phase == 'trace-worker' || inputs.phase == 'trace-refusal' || inputs.phase == 'trace-growth'
        env:
          QA_TRACE: ${{ inputs.phase }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build/qa-host --parallel 4 --target pos2_pr118_grow_worker_client_test
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = 0
          $repeats = if ($env:QA_TRACE -eq 'trace-refusal') { 20 } elseif ($env:QA_TRACE -eq 'trace-growth') { 24 } else { 5 }
          foreach ($attempt in 1..$repeats) {
            Write-Output "Native worker trial $attempt"
            & ./build/qa-host/tools/parity/pos2_pr118_grow_worker_client_test.exe
            if ($LASTEXITCODE -ne 0) { ++$failed }
          }
          if ($failed) { throw "$failed native worker trials failed" }
      - name: Run standalone authenticated network checks
        if: inputs.phase == 'diagnose'
        run: ctest --test-dir build/qa-host --output-on-failure --no-tests=error --timeout 180 -R '^compute_(membership|worker)_network_test$'
      - name: Run the release regressions with native diagnostics
        if: inputs.phase == 'diagnose' && !cancelled()
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $targets = @('cli_host_test','group_calibration_process_test','pos2_pr118_grow_inventory_test','pos2_pr118_grow_retirement_test','pos2_pr118_grow_worker_client_test','pos2_pr118_grow_pool_codec_test','pos2_pr118_grow_pool_owner_test')
          cmake --build build/qa-host --parallel 4 --target $targets
          ctest --test-dir build/qa-host --output-on-failure --no-tests=error --timeout 900 -R '^(cli_host_test|group_calibration_process_test|pos2_pr118_grow_(worker_client|pool_codec|pool_owner|inventory|retirement)_test)$'
      - name: Preserve native CTest results
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: native-ctest-record
          path: build/qa-host/Testing/Temporary/LastTest.log
          retention-days: 3
          if-no-files-found: ignore
  recovery:
    name: Interrupted native fresh compact publication
    if: inputs.phase == 'archive-recovery'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify the source-pinned production archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          gh run download 45119299025 --repo Jsewill/xchplot2 -n windows-hardware-x86_64 -D archive
          $zip = @(Get-ChildItem -Path archive/*.zip)
          if ($zip.Count -ne 1) { throw 'Expected one Windows qualification archive' }
          $hash = ((Get-Content -LiteralPath ($zip[0].FullName + '.sha256') -Raw) -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $zip[0].FullName).Hash -ne $hash) { throw 'Archive checksum mismatch' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath package
          $info = @(Get-ChildItem -LiteralPath package -Filter BUILDINFO.txt -Recurse)
          if ($info.Count -ne 1 -or !(Select-String -LiteralPath $info[0].FullName -Pattern '^Source:\s*69a33e4294c4847cb74b82487768de71f04affc4\s*$' -Quiet)) { throw 'Archive source mismatch' }
      - name: Resume each native data boundary and verify published bytes and full proofs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          """Interrupt native fresh compact output at each data boundary and reproduce the CPU reference."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          exe=Path(sys.argv[1]).resolve()
          root=Path(sys.argv[2]).resolve()
          root.mkdir()
          base_env=dict(os.environ, XCHPLOT2_NO_AUTO_SPILL="1", PATH=str(exe.parent)+os.pathsep+os.environ["PATH"])
          full=[]
          for point in ("direct-target-partial","direct-target","direct-committed"):
              work=root/point
              work.mkdir()
              manifest=work/"fixture.tsv"
              manifest.write_text("18 2 0 0 gplot-v2-grouped "+"ab"*32+" "+"00"*112+" . final.gplot 2\n",encoding="ascii")
              env=dict(base_env,XCHPLOT2_TEMP_DIR=str(manifest))
              for key in ("TEMP","TMP","TMPDIR","XDG_CONFIG_HOME","XDG_CACHE_HOME","XDG_STATE_HOME"):
                  path=work/key
                  path.mkdir(exist_ok=True)
                  env[key]=str(path)
              cmd=["batch",str(manifest),"--devices","cpu","--workers","4","--compute","off","--no-auto-spill","--destination-temp","off","--member-storage","compact","--construction","incremental","--batch-members","2","--window-bytes","16M","--checkpoint-bytes","128K","--no-progress","--config",os.devnull]
              def run(name,args,expected,settings):
                  p=subprocess.run([str(exe),*args],cwd=work,env=settings,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=150)
                  (work/(name+".log")).write_bytes(p.stdout)
                  assert p.returncode==expected,(name,p.returncode,p.stdout[-1000:])
                  return p.stdout.decode("utf-8","replace")
              run("interrupted",cmd,86,dict(env,XCHPLOT2_GROW_FAILPOINT=point))
              out=work/"final.gplot"
              assert not out.exists() and (work/"final.gplot.partial").is_file()
              run("resumed",cmd+["--resume"],0,env)
              assert out.stat().st_size==1297757 and not (work/"final.gplot.partial").exists()
              with out.open("rb") as source: digest=hashlib.file_digest(source,"sha256").hexdigest()
              assert digest=="bf3471eb57ced71e255f2d11842b4ee39a2bdf92bc80f4570fb80e828eb6470a"
              checked=run("proofs",["verify",str(out),"--full","--trials","60","--config",os.devnull],0,env)
              proofcounts=[int(v) for v in re.findall(r"(\d+) full proofs validated",checked)]
              assert len(proofcounts)==1 and proofcounts[0]>0
              full.append({"point":point,"sha256":digest,"proofs":proofcounts[0]})
              print(json.dumps(full[-1]),flush=True)
          (root/"results.json").write_text(json.dumps(full,indent=2))
          '@ | Set-Content -LiteralPath native-recovery.py -Encoding utf8
          $exe = @(Get-ChildItem -LiteralPath package -Filter xchplot2.exe -Recurse)
          if ($exe.Count -ne 1) { throw 'Expected one native executable' }
          python -B -u native-recovery.py $exe[0].FullName native-evidence
      - uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: native-recovery-results
          path: |
            native-evidence/**/*.log
            native-evidence/results.json
          if-no-files-found: ignore
          retention-days: 3

  file-sharing:
    name: Native NTFS credential publication
    if: inputs.phase == 'file-sharing'
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Check atomic publication with active readers and denied writes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Text;
          using Microsoft.Win32.SafeHandles;
          public static class CredentialRenameMatrix {
              [DllImport("kernel32", CharSet=CharSet.Unicode, SetLastError=true)]
              static extern bool MoveFileExW(string source, string destination, uint flags);
              [DllImport("kernel32", CharSet=CharSet.Unicode, SetLastError=true)]
              static extern SafeFileHandle CreateFileW(string name, uint access, uint share, IntPtr sa, uint disposition, uint flags, IntPtr template);
              [DllImport("kernel32", SetLastError=true)]
              static extern bool SetFileInformationByHandle(SafeFileHandle h, int kind, IntPtr buffer, uint size);
              [DllImport("kernel32", SetLastError=true)]
              static extern bool FlushFileBuffers(SafeFileHandle h);
              [StructLayout(LayoutKind.Sequential,CharSet=CharSet.Unicode)]
              struct Rename { public uint flags; public IntPtr root; public uint bytes; public char name; }
              public static int Move(string source, string target, bool posix) {
                  if (!posix)
                      return MoveFileExW(source, target, 1u | 8u) ? 0 : Marshal.GetLastWin32Error();
                  using (var file = CreateFileW(source, 0x40010000u, 7, IntPtr.Zero, 3, 0x80200000u, IntPtr.Zero)) {
                      if (file.IsInvalid) return Marshal.GetLastWin32Error();
                      var name = Encoding.Unicode.GetBytes(target);
                      int size = Marshal.SizeOf(typeof(Rename)) + name.Length;
                      IntPtr data = Marshal.AllocHGlobal(size);
                      try {
                          Marshal.Copy(new byte[size], 0, data, size);
                          Marshal.WriteInt32(data, 3);
                          Marshal.WriteInt32(data, Marshal.OffsetOf(typeof(Rename), "bytes").ToInt32(), name.Length);
                          Marshal.Copy(name, 0, IntPtr.Add(data, Marshal.OffsetOf(typeof(Rename), "name").ToInt32()), name.Length);
                          if (!SetFileInformationByHandle(file, 22, data, (uint)size)) return Marshal.GetLastWin32Error();
                          if (!FlushFileBuffers(file)) throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());
                          return 0;
                      } finally { Marshal.FreeHGlobal(data); }
                  }
              }
          }
          '@
          $root = Join-Path ([IO.Path]::GetTempPath()) ('xchplot2-private-rename-' + [Guid]::NewGuid().ToString('N'))
          $null = [IO.Directory]::CreateDirectory($root)
          $user = [Security.Principal.WindowsIdentity]::GetCurrent().User
          try {
              foreach ($mode in 'closed','share-delete','no-share-delete','read-only','deny-delete') {
                  foreach ($method in 'MoveFileEx','FileRenameInfoEx') {
                      $dir = Join-Path $root "$mode-$method"
                      $null = [IO.Directory]::CreateDirectory($dir)
                      $source = Join-Path $dir 'new.pem'
                      $target = Join-Path $dir 'credentials.pem'
                      [IO.File]::WriteAllBytes($source, [byte[]]@(2))
                      [IO.File]::WriteAllBytes($target, [byte[]]@(1))
                      foreach ($path in $source,$target) {
                          $acl = Get-Acl -LiteralPath $path
                          $acl.SetAccessRuleProtection($true,$false)
                          $acl.SetAccessRule([Security.AccessControl.FileSystemAccessRule]::new($user, 'FullControl', 'Allow'))
                          Set-Acl -LiteralPath $path -AclObject $acl
                      }
                      $oldDirAcl = Get-Acl -LiteralPath $dir
                      $oldTargetAcl = Get-Acl -LiteralPath $target
                      $held = $null
                      try {
                          if ($mode -eq 'read-only') { [IO.File]::SetAttributes($target, [IO.FileAttributes]::ReadOnly) }
                          if ($mode -eq 'deny-delete') {
                              $acl = Get-Acl -LiteralPath $target
                              $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($user, 'Delete', 'Deny'))
                              Set-Acl -LiteralPath $target -AclObject $acl
                              $acl = Get-Acl -LiteralPath $dir
                              $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new($user, 'DeleteSubdirectoriesAndFiles', 'Deny'))
                              Set-Acl -LiteralPath $dir -AclObject $acl
                          }
                          if ($mode -like '*share-delete') {
                              $sharing = [IO.FileShare]::ReadWrite
                              if ($mode -eq 'share-delete') { $sharing = $sharing -bor [IO.FileShare]::Delete }
                              $held = [IO.File]::Open($target, 'Open', 'Read', $sharing)
                          }
                          $errorCode = [CredentialRenameMatrix]::Move($source, $target, $method -eq 'FileRenameInfoEx')
                          $old = if ($held) { $held.ReadByte() } else { 'none' }
                          $current = [IO.File]::ReadAllBytes($target)[0]
                          $protected = (Get-Acl -LiteralPath $target).AreAccessRulesProtected
                          "case=$mode method=$method win32=$errorCode pathname_byte=$current held_byte=$old protected=$protected"
                      } finally {
                          if ($held) { $held.Dispose() }
                          if ($mode -eq 'deny-delete') {
                              Set-Acl -LiteralPath $dir -AclObject $oldDirAcl
                              Set-Acl -LiteralPath $target -AclObject $oldTargetAcl
                          }
                          [IO.File]::SetAttributes($target, [IO.FileAttributes]::Normal)
                      }
                  }
              }
          } finally { [IO.Directory]::Delete($root, $true) }
