          cmake -S . -B build/qa-host -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DXCHPLOT2_HOST_TESTS_ONLY=ON "-DCMAKE_PROJECT_INCLUDE=$repo/build/diagnostic-groups.cmake" "-DOPENSSL_ROOT_DIR=$tls" -DOPENSSL_USE_STATIC_LIBS=ON "-DLIB_EAY_RELEASE:FILEPATH=$crypto" "-DSSL_EAY_RELEASE:FILEPATH=$ssl" "-DLIB_EAY:FILEPATH=$crypto" "-DSSL_EAY:FILEPATH=$ssl"
