name: install-matrix

# Clean Linux / WSL2 installs and production Containerfile builds.
# Check installed backends and CPU plotting; GPU execution lives in gpu.yml.

on:
  pull_request:
    paths:
      - .github/workflows/install-matrix.yml
      - .dockerignore
      - Containerfile
      - CMakeLists.txt
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - cmake/**
      - keygen-rs/**
      - src/**
      - tools/**
      - contrib/**
      - ci/release/adaptivecpp-*.patch
      - scripts/install-deps.sh
      - scripts/test/native-install.sh
      - scripts/test/recovery.py
      - scripts/test/group-cli.py
      - scripts/test/compute-cli.py
      - scripts/test/group-pool-test.py
  push:
    branches: [main]
    paths:
      - .github/workflows/install-matrix.yml
      - .dockerignore
      - Containerfile
      - CMakeLists.txt
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - cmake/**
      - keygen-rs/**
      - src/**
      - tools/**
      - contrib/**
      - ci/release/adaptivecpp-*.patch
      - scripts/install-deps.sh
      - scripts/test/native-install.sh
      - scripts/test/recovery.py
      - scripts/test/group-cli.py
      - scripts/test/compute-cli.py
      - scripts/test/group-pool-test.py
  workflow_dispatch:
  schedule:
    # Package repositories can break a fresh install without source changes.
    - cron: '31 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native / ${{ matrix.os.name }} / ${{ matrix.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ matrix.os.image }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-13
            image: debian:13
          - name: fedora-44
            image: fedora:44
          - name: arch
            image: archlinux:base-devel
        gpu: [nvidia, amd, intel]
        exclude:
          # Debian 13 has no Intel compute-runtime package, even in backports.
          # Intel native installs are covered on Ubuntu, Fedora, Arch, and WSL2.
          - os:
              name: debian-13
              image: debian:13
            gpu: intel
        include:
          # Cargo must also build AdaptiveCpp when only system packages exist.
          - os:
              name: fedora-44-fetch
              image: fedora:44
            gpu: amd
            fetch: true
          - os:
              name: ubuntu-24.04-fetch
              image: ubuntu:24.04
            gpu: nvidia
            fetch: true
          - os:
              name: ubuntu-24.04-fetch
              image: ubuntu:24.04
            gpu: intel
            fetch: true
    steps:
      - name: Bootstrap checkout and sudo
        shell: bash
        run: |
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              apt-get update
              apt-get install -y --no-install-recommends git sudo ca-certificates
              ;;
            fedora) dnf install -y git sudo ca-certificates ;;
            # base-devel has sudo; leave the fresh package database for
            # install-deps.sh to initialize. Checkout can use its archive fallback.
            arch) ;;
          esac
      - uses: actions/checkout@v7
      - name: Install dependencies, Cargo binary, and CMake binary
        shell: bash
        run: bash scripts/test/native-install.sh '${{ matrix.gpu }}' ${{ matrix.fetch && '--no-acpp' || '' }} 2>&1 | tee native-install.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-${{ matrix.os.name }}-${{ matrix.gpu }}
          path: native-install.log
          retention-days: 14

  wsl:
    name: WSL2 / ubuntu-24.04 / ${{ matrix.gpu }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gpu: [nvidia, amd, intel]
    steps:
      - name: Preserve Linux script line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: 'false'
      - name: Install and build in a fresh WSL2 filesystem
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          uname -r | grep -i microsoft
          log="$PWD/native-install.log"
          # Build on WSL's Linux filesystem, as in a normal Linux checkout.
          source_dir=$(mktemp -d -p "$HOME" xchplot2-ci-XXXXXX)
          cp -a . "$source_dir/"
          cd "$source_dir"
          bash scripts/test/native-install.sh '${{ matrix.gpu }}' 2>&1 | tee "$log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wsl-ubuntu-24.04-${{ matrix.gpu }}
          path: native-install.log
          retention-days: 14

  build:
    name: build / ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          # CUDA 13.x covers Turing and newer GPUs; Pascal requires 12.9.
          - name: nvidia-cuda13
            backend: cuda
            extra_args: "--build-arg CUDA_ARCH=75"
          - name: nvidia-cuda12-pascal
            backend: cuda
            extra_args: >-
              --build-arg BASE_DEVEL=docker.io/nvidia/cuda:12.9.1-devel-ubuntu24.04
              --build-arg BASE_RUNTIME=docker.io/nvidia/cuda:12.9.1-devel-ubuntu24.04
              --build-arg CUDA_ARCH=61
          # CPU-only OpenMP runtime on the plain Ubuntu base.
          - name: cpu-omp
            backend: omp
            extra_args: >-
              --build-arg BASE_DEVEL=docker.io/ubuntu:24.04
              --build-arg BASE_RUNTIME=docker.io/ubuntu:24.04
              --build-arg ACPP_TARGETS=omp
              --build-arg XCHPLOT2_BUILD_CUDA=OFF
              --build-arg INSTALL_CUDA_HEADERS=1
          # Generic SYCL defers vendor codegen to runtime and avoids mixing
          # the rolling ROCm bitcode with the installer's pinned LLVM.
          - name: amd-rocm
            backend: hip
            extra_args: >-
              --build-arg BASE_DEVEL=docker.io/rocm/dev-ubuntu-24.04:latest
              --build-arg BASE_RUNTIME=docker.io/rocm/dev-ubuntu-24.04:latest
              --build-arg ACPP_TARGETS=generic
              --build-arg XCHPLOT2_BUILD_CUDA=OFF
              --build-arg INSTALL_CUDA_HEADERS=1
          # Intel generic SYCL requires the Level Zero backend.
          - name: intel-oneapi
            backend: ze
            extra_args: >-
              --build-arg BASE_DEVEL=docker.io/intel/oneapi-basekit:latest
              --build-arg BASE_RUNTIME=docker.io/intel/oneapi-runtime:latest
              --build-arg ACPP_TARGETS=generic
              --build-arg WITH_LEVEL_ZERO_BACKEND=ON
              --build-arg XCHPLOT2_BUILD_CUDA=OFF
              --build-arg INSTALL_CUDA_HEADERS=1
    steps:
      - uses: actions/checkout@v7
      - name: podman build (${{ matrix.target.name }})
        run: |
          podman build -t xchplot2-ci:${{ matrix.target.name }} \
            ${{ matrix.target.extra_args }} \
            -f Containerfile .
      - name: Required backend, installed CLI, and CPU plot/proof checks
        run: |
          podman run --rm --entrypoint test xchplot2-ci:${{ matrix.target.name }} \
            -f /opt/adaptivecpp/lib/hipSYCL/librt-backend-${{ matrix.target.backend }}.so
          podman run --rm xchplot2-ci:${{ matrix.target.name }} --help
          podman run --rm -e ACPP_VISIBILITY_MASK=omp \
            --entrypoint plot_file_parity xchplot2-ci:${{ matrix.target.name }}
