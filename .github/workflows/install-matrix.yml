name: install-matrix

# Verifies clean native installs as well as SYCL Containerfile builds.
# Linux and WSL2 run the public dependency installer, Cargo install, and
# CMake build with no cached toolchains. Container builds cover the documented
# backend matrix (NVIDIA / AMD / Intel / CPU). Each job exercises a
# different ACPP_TARGETS configuration via the existing production
# Containerfile — the same one users build via scripts/build-container.sh.
#
# No actual accelerator hardware needed for the build; nvcc / hipcc
# / icx etc. all compile fine without a runtime device present. The
# assertion is that the container builds, the installed binary starts, and
# CPU plot/proof checks pass. GPU kernel execution needs GPU runners;
# generic SYCL builds defer vendor device compilation until runtime.

on:
  pull_request:
    paths-ignore:
      # Docs & metadata
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.markdownlint*'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      # Runtime scripts not exercised by the install matrix.
      - 'scripts/test-multi-gpu.sh'
      - 'scripts/build-container.sh'
      - 'scripts/install-container-deps.sh'
      # docker-compose isn't exercised by CI (we drive podman build
      # directly).
      - 'compose.yaml'
      # Sibling CI workflows.
      - '.github/workflows/ci.yml'
      - '.github/workflows/arch-matrix.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - '.markdownlint*'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - 'scripts/test-multi-gpu.sh'
      - 'scripts/build-container.sh'
      - 'scripts/install-container-deps.sh'
      - 'compose.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/arch-matrix.yml'
  workflow_dispatch:
  schedule:
    # Package repositories can break a fresh install without source changes.
    - cron: '31 9 * * 1'

permissions:
  contents: read

jobs:
  native:
    name: native / ${{ matrix.os.name }} / ${{ matrix.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ matrix.os.image }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu-24.04
            image: ubuntu:24.04
          - name: debian-13
            image: debian:13
          - name: fedora-44
            image: fedora:44
          - name: arch
            image: archlinux:base-devel
        gpu: [nvidia, amd, intel]
        exclude:
          # Debian 13 has no Intel compute-runtime package, even in backports.
          # Intel native installs are covered on Ubuntu, Fedora, Arch, and WSL2.
          - os:
              name: debian-13
              image: debian:13
            gpu: intel
        include:
          # Cargo must also build AdaptiveCpp when only system packages exist.
          - os:
              name: fedora-44-fetch
              image: fedora:44
            gpu: amd
            fetch: true
          - os:
              name: ubuntu-24.04-fetch
              image: ubuntu:24.04
            gpu: nvidia
            fetch: true
          - os:
              name: ubuntu-24.04-fetch
              image: ubuntu:24.04
            gpu: intel
            fetch: true
    steps:
      - name: Bootstrap checkout and sudo
        shell: bash
        run: |
          . /etc/os-release
          case "$ID" in
            ubuntu|debian)
              apt-get update
              apt-get install -y --no-install-recommends git sudo ca-certificates
              ;;
            fedora) dnf install -y git sudo ca-certificates ;;
            # base-devel has sudo; leave the fresh package database for
            # install-deps.sh to initialize. Checkout can use its archive fallback.
            arch) ;;
          esac
      - uses: actions/checkout@v7
      - name: Install dependencies, Cargo binary, and CMake binary
        shell: bash
        run: bash scripts/test/native-install.sh '${{ matrix.gpu }}' ${{ matrix.fetch && '--no-acpp' || '' }} 2>&1 | tee native-install.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-${{ matrix.os.name }}-${{ matrix.gpu }}
          path: native-install.log
          retention-days: 14

  wsl:
    name: WSL2 / ubuntu-24.04 / ${{ matrix.gpu }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gpu: [nvidia, amd, intel]
    steps:
      - name: Preserve Linux script line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: 'false'
      - name: Install and build in a fresh WSL2 filesystem
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          uname -r | grep -i microsoft
          log="$PWD/native-install.log"
          # Build on WSL's Linux filesystem, as in a normal Linux checkout.
          source_dir=$(mktemp -d -p "$HOME" xchplot2-ci-XXXXXX)
          cp -a . "$source_dir/"
          cd "$source_dir"
          bash scripts/test/native-install.sh '${{ matrix.gpu }}' 2>&1 | tee "$log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wsl-ubuntu-24.04-${{ matrix.gpu }}
          path: native-install.log
          retention-days: 14

  build:
    name: build / ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # NVIDIA — default base, CUDA 13.x for Turing+; sets sm_75 so
          # we don't trip the preflight that bans pre-Turing on 13.x.
          - name: nvidia-cuda13
            backend: cuda
            extra_args: "--build-arg CUDA_ARCH=75"
          # NVIDIA Pascal (sm_61) — must use the 12.9 base because
          # CUDA 13.x dropped Pascal codegen. Catches preflight
          # regressions.
          - name: nvidia-cuda12-pascal
            backend: cuda
            extra_args: >-
              --build-arg BASE_DEVEL=docker.io/nvidia/cuda:12.9.1-devel-ubuntu24.04
              --build-arg BASE_RUNTIME=docker.io/nvidia/cuda:12.9.1-devel-ubuntu24.04
              --build-arg CUDA_ARCH=61
          # CPU-only — AdaptiveCpp OpenMP backend. No CUDA toolkit in
          # the runtime image; build still wants cuda_fp16.h headers,
          # supplied by INSTALL_CUDA_HEADERS=1.
          - name: cpu-omp
            backend: omp
            extra_args: >-
              --build-arg BASE_DEVEL=docker.io/ubuntu:24.04
              --build-arg BASE_RUNTIME=docker.io/ubuntu:24.04
              --build-arg ACPP_TARGETS=omp
              --build-arg XCHPLOT2_BUILD_CUDA=OFF
              --build-arg INSTALL_CUDA_HEADERS=1
          # AMD ROCm — AdaptiveCpp generic (SSCP JIT). Two reasons for
          # `generic` instead of `hip:gfxNNNN` AOT compilation in CI:
          #
          #   1. rocm/dev-ubuntu-24.04:latest ships device bitcode
          #      (ocml.bc) built with rolling LLVM 22+. AdaptiveCpp's
          #      install-deps.sh pins clang/lld to LLVM 18 for
          #      compatibility with its own build. The LLVM-18 clang
          #      can't link bitcode produced by LLVM-22 (attribute
          #      kind 102 added in LLVM 22) — hard build error.
          #
          #   2. CI has no AMD GPU anyway, so AOT-for-gfxNNNN doesn't
          #      give us runtime signal. SSCP defers device codegen
          #      to runtime, lets the build prove "the SYCL TUs
          #      compile against ROCm headers + libs" which is the
          #      meaningful CI assertion.
          #
          # Same pattern the README recommends for RDNA1 cards
          # (gfx101x) and matches the Intel oneAPI entry below.
          - name: amd-rocm
            backend: hip
            extra_args: >-
              --build-arg BASE_DEVEL=docker.io/rocm/dev-ubuntu-24.04:latest
              --build-arg BASE_RUNTIME=docker.io/rocm/dev-ubuntu-24.04:latest
              --build-arg ACPP_TARGETS=generic
              --build-arg XCHPLOT2_BUILD_CUDA=OFF
              --build-arg INSTALL_CUDA_HEADERS=1
          # Intel oneAPI — AdaptiveCpp generic (SSCP) → Level Zero.
          # README flags this path as experimental / not perf-tested;
          # CI's role is "the build still works", not "it runs well".
          - name: intel-oneapi
            backend: ze
            extra_args: >-
              --build-arg BASE_DEVEL=docker.io/intel/oneapi-basekit:latest
              --build-arg BASE_RUNTIME=docker.io/intel/oneapi-runtime:latest
              --build-arg ACPP_TARGETS=generic
              --build-arg WITH_LEVEL_ZERO_BACKEND=ON
              --build-arg XCHPLOT2_BUILD_CUDA=OFF
              --build-arg INSTALL_CUDA_HEADERS=1
    steps:
      - uses: actions/checkout@v7
      - name: podman build (${{ matrix.target.name }})
        run: |
          podman build -t xchplot2-ci:${{ matrix.target.name }} \
            ${{ matrix.target.extra_args }} \
            -f Containerfile .
      - name: Required backend, installed CLI, and CPU plot/proof checks
        run: |
          podman run --rm --entrypoint test xchplot2-ci:${{ matrix.target.name }} \
            -f /opt/adaptivecpp/lib/hipSYCL/librt-backend-${{ matrix.target.backend }}.so
          podman run --rm xchplot2-ci:${{ matrix.target.name }} --help
          podman run --rm -e ACPP_VISIBILITY_MASK=omp \
            --entrypoint plot_file_parity xchplot2-ci:${{ matrix.target.name }}
