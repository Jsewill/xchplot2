name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts/
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck

  actions:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  rust:
    name: Rust (keygen-rs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: keygen-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keygen-rs
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo check
        run: cargo check --all-targets --locked
      - name: cargo clippy (advisory)
        run: cargo clippy --all-targets --locked -- -W clippy::all
        continue-on-error: true
      - name: cargo test
        run: cargo test --all-targets --locked

  host-tests:
    name: C++ host tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shared host targets need no GPU toolchain; sanitizers cover host memory
    # and concurrency separately from the hardware suites.
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, thread, address]
    steps:
      - uses: actions/checkout@v7
      - name: Run host tests
        run: |
          if [ "${{ matrix.mode }}" = "plain" ]; then
            scripts/test/host-tests.sh
          else
            scripts/test/host-tests.sh "${{ matrix.mode }}"
          fi

  python:
    name: Python harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Check build target selection
        run: python3 scripts/test/build-selection.py
      - name: Check GPU CI admission logic
        run: python3 scripts/test/gpu-ci-test.py
      - name: Check growth benchmark measurement
        run: python3 scripts/test/group-benchmark-test.py
      - name: Check compute network harness
        run: python3 scripts/test/compute-network-test.py

  hadolint:
    name: hadolint Containerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile
          # Package versions follow the selected CUDA / ROCm base image.
          failure-threshold: error

  compose-config:
    name: docker compose config validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config --quiet
        run: docker compose -f compose.yaml config --quiet

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.52.0

  markdownlint:
    name: Markdown documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: List tracked Markdown
        id: docs
        run: |
          {
            echo 'files<<EOF'
            git ls-files '*.md'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: ${{ steps.docs.outputs.files }}
      - name: Check local documentation links
        run: |
          python3 scripts/test/docs.py --self-test
          python3 scripts/test/docs.py

  install-container-deps-dryrun:
    name: install-container-deps.sh — dry-run fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Diff --dry-run output against fixtures
        run: scripts/test/install-container-deps/run.sh

  install-container-deps-smoke:
    name: install-container-deps.sh smoke (${{ matrix.engine }} ${{ matrix.gpu }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: podman
            gpu: cpu
          - engine: podman
            gpu: amd
          - engine: docker
            gpu: cpu
        # NVIDIA smoke is intentionally skipped: nvidia-ctk cdi generate
        # needs a real GPU + driver to populate the spec, and the dry-run
        # fixtures already cover the planning logic for that path.
    steps:
      - uses: actions/checkout@v7
      - name: Real install in ubuntu:24.04 + assert idempotent re-run
        env:
          ENGINE: ${{ matrix.engine }}
          GPU: ${{ matrix.gpu }}
        run: |
          docker run --rm \
              -e ENGINE -e GPU \
              -v "$PWD/scripts:/s:ro" \
              docker.io/ubuntu:24.04 \
              bash -ec '
                  apt-get update -qq
                  apt-get install -y -qq sudo curl ca-certificates gnupg >/dev/null
                  /s/install-container-deps.sh --engine "$ENGINE" --gpu "$GPU"
                  # Idempotence: a clean second run must still exit 0.
                  /s/install-container-deps.sh --engine "$ENGINE" --gpu "$GPU"
              '
