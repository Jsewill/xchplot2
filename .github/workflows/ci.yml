name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Push filters cover only that push; later pushes must not discard its checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      actions: ${{ steps.filter.outputs.actions }}
      rust: ${{ steps.filter.outputs.rust }}
      host: ${{ steps.filter.outputs.host }}
      python: ${{ steps.filter.outputs.python }}
      group: ${{ steps.filter.outputs.group }}
      container: ${{ steps.filter.outputs.container }}
      compose: ${{ steps.filter.outputs.compose }}
      docs: ${{ steps.filter.outputs.docs }}
      installer: ${{ steps.filter.outputs.installer }}
      installer-smoke: ${{ steps.filter.outputs.installer-smoke }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref }}
          filters: |
            shell:
              - '.github/workflows/ci.yml'
              - '.shellcheckrc'
              - 'scripts/**/*.sh'
            actions:
              - '.github/workflows/**'
              - '.github/actionlint.{yaml,yml}'
            rust:
              - '.github/workflows/ci.yml'
              - 'keygen-rs/Cargo.{toml,lock}'
              - 'keygen-rs/src/**'
            host:
              - '.github/workflows/ci.yml'
              - 'CMakeLists.txt'
              - 'cmake/{BuildVersion,HostTests,RegisterTests}.cmake'
              - 'scripts/test/host-tests.sh'
              - 'src/host/{Batch*,BenchStats,BoundedProofSampling,Cancel,ConfigFile,GpuBufferPool,GpuCleanup,GpuPipeline,GpuPlotter}.hpp'
              - 'src/host/{ComputeNetwork,ComputePool,ComputeSession,ComputeWorker}.hpp'
              - 'src/host/{GroupCalibrationProcess,GroupComputeSettings,GroupFarmComputeResources,GroupFarmFile,GroupFarmMetadata,GroupFarmResources}.hpp'
              - 'src/host/{GroupFarming,GroupFile,GroupHarvesterProfile,GroupNativeIdentity,GroupOptions,GroupPacked,GroupPlotter,GroupPublication}.hpp'
              - 'src/host/{HostGuard,HostPinnedPool,HostRamPolicy,Json,MultiGpuPipelineParallel,MultiGpuShardBufferPool,NumaTopology,PlotFileWriterParallel,PoolSizing,Random,Spill*,TempFile,Utf8,Vram*}.hpp'
              - 'src/host/{BatchManifest,Cancel,ConfigFile,HostPinnedPool,HostRamPolicy,MultiGpuPipelineParallel,NumaTopology,TempFile}.cpp'
              - 'src/gpu/{DeviceIds,SpillTileReader,SyclDeviceList,TwoPhaseScratch}.hpp'
              - 'keygen-rs/include/**'
              - 'tools/xchplot2/{cli,group_commands,group_options}.cpp'
              - 'tools/xchplot2/{device_options,group_commands}.hpp'
              - 'tools/parity/{bench_stats,bounded_proof_sampling,cli_host,group_calibration_process,group_compute_resources,group_farm_metadata,group_farm_resources,group_file,group_harvester_profile,host_guard,host_spill_policy,numa_topology,pipeline_control,spill_coverage,spill_engine,temp_file,vram_budget,vram_probe}_test.cpp'
              - 'tools/parity/pipeline_control_test/**'
            python:
              - '.github/workflows/ci.yml'
              - 'cmake/{TargetSelection,CudaArchitectures,AdaptiveCppDependencies}.cmake'
              - 'scripts/test/{build-selection,gpu-ci,gpu-ci-test,group-benchmark-test,compute-network,compute-network-test}.py'
              - 'contrib/pos2-pr118/group-benchmark.py'
            group:
              - '.github/workflows/ci.yml'
              - 'cmake/{GroupPlotter,GroupTests,ComputePool,ComputeWorker,RegisterTests}.cmake'
              - 'contrib/pos2-pr118/{CMakeLists.txt,*.cpp,plot-index-base.patch}'
              - 'contrib/pos2-{plotter-output-move,solver-*,worker-thread-limit}.patch'
              - 'keygen-rs/{Cargo.toml,Cargo.lock,src/**,include/**}'
              - 'src/host/{Group*,Compute*,BatchPlotter,BenchStats,CpuPlotMemory,CpuTables,GpuBufferPool,GpuCleanup,GpuPipeline,GpuPlotter,Json,MultiGpuPipelineParallel,NumaTopology,PoolSizing,Random,Utf8,VramBudget,WindowsFile,WorkerGpuProcess}.hpp'
              - 'src/host/{Compute*,GroupPlotter,NumaTopology}.cpp'
              - 'src/gpu/{AsyncErrorLog,DeviceIds,SyclDeviceList}.hpp'
              - 'tools/xchplot2/{compute_broker,compute_worker,group_options,group_commands,group_reference}.cpp'
              - 'tools/xchplot2/{compute_output,device_options,group_commands}.hpp'
              - 'tools/parity/compute_*'
              - 'tools/parity/group_{checkpoint_compatibility,codec,external,farming,gpu_output,inventory,merge,replot_resources,retirement,scratch,staging}_test.cpp'
              - 'tools/parity/group_farm_{control,membership,progress}_test.hpp'
            container:
              - '.github/workflows/ci.yml'
              - '.hadolint.yaml'
              - Containerfile
            compose:
              - '.github/workflows/ci.yml'
              - compose.yaml
            docs:
              - '.github/workflows/ci.yml'
              - '**/*.md'
              - '.markdownlint*'
              - 'scripts/test/docs.py'
              # Renames include the removed name. Any tracked file can be linked.
              - deleted: '**'
            installer:
              - '.github/workflows/ci.yml'
              - 'scripts/install-container-deps.sh'
              - 'scripts/test/install-container-deps/**'
            installer-smoke:
              - '.github/workflows/ci.yml'
              - 'scripts/install-container-deps.sh'

  shell:
    name: ShellCheck
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts/
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck

  actions:
    name: actionlint
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  rust:
    name: Rust (keygen-rs)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: keygen-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keygen-rs
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (warnings advisory)
        run: cargo clippy --all-targets --locked -- -W clippy::all
      - name: cargo test
        run: cargo test --all-targets --locked

  host-tests:
    name: C++ host tests (${{ matrix.mode }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shared host targets need no GPU toolchain; sanitizers cover host memory
    # and concurrency separately from the hardware suites.
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, thread, address]
    steps:
      - uses: actions/checkout@v7
      - name: Run host tests
        run: |
          if [ "${{ matrix.mode }}" = "plain" ]; then
            scripts/test/host-tests.sh
          else
            scripts/test/host-tests.sh "${{ matrix.mode }}"
          fi

  python:
    name: Python harness checks
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Check build target selection
        run: python3 scripts/test/build-selection.py
      - name: Check GPU CI admission logic
        run: python3 scripts/test/gpu-ci-test.py
      - name: Check growth benchmark measurement
        run: python3 scripts/test/group-benchmark-test.py
      - name: Check compute network harness
        run: python3 scripts/test/compute-network-test.py

  group-tests:
    name: C++ construction and compute tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.group == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TLS development headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure CPU reference tests
        run: >-
          cmake -S contrib/pos2-pr118 -B build-group-tests
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DXCHPLOT2_BUILD_GROUP_POOL=ON
      - name: Build CPU reference tests
        run: cmake --build build-group-tests --parallel 2
      - name: Run construction and compute tests
        run: >-
          ctest --test-dir build-group-tests --output-on-failure
          --no-tests=error --timeout 900

  hadolint:
    name: hadolint Containerfile
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile
          # Package versions follow the selected CUDA / ROCm base image.
          failure-threshold: error

  compose-config:
    name: docker compose config validate
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config --quiet
        run: docker compose -f compose.yaml config --quiet

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.52.2

  markdownlint:
    name: Markdown documentation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: List tracked Markdown
        id: docs
        run: |
          {
            echo 'files<<EOF'
            git ls-files '*.md'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: ${{ steps.docs.outputs.files }}
      - name: Check local documentation links
        run: |
          python3 scripts/test/docs.py --self-test
          python3 scripts/test/docs.py

  install-container-deps-dryrun:
    name: install-container-deps.sh — dry-run fixtures
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Diff --dry-run output against fixtures
        run: scripts/test/install-container-deps/run.sh

  install-container-deps-smoke:
    name: install-container-deps.sh smoke (${{ matrix.engine }} ${{ matrix.gpu }})
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.installer-smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: podman
            gpu: cpu
          - engine: podman
            gpu: amd
          - engine: docker
            gpu: cpu
        # NVIDIA smoke is intentionally skipped: nvidia-ctk cdi generate
        # needs a real GPU + driver to populate the spec, and the dry-run
        # fixtures already cover the planning logic for that path.
    steps:
      - uses: actions/checkout@v7
      - name: Real install in ubuntu:24.04 + assert idempotent re-run
        env:
          ENGINE: ${{ matrix.engine }}
          GPU: ${{ matrix.gpu }}
        run: |
          docker run --rm \
              -e ENGINE -e GPU \
              -v "$PWD/scripts:/s:ro" \
              docker.io/ubuntu:24.04 \
              bash -ec '
                  apt-get update -qq
                  apt-get install -y -qq sudo curl ca-certificates gnupg >/dev/null
                  /s/install-container-deps.sh --engine "$ENGINE" --gpu "$GPU"
                  # Idempotence: a clean second run must still exit 0.
                  /s/install-container-deps.sh --engine "$ENGINE" --gpu "$GPU"
              '
